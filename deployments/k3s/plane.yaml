# Plane on the K3s cluster (k3s.tmlab.top), namespace `plane`.
# Applied by .github/workflows/release-deploy.yml with __DOCKER_USERNAME__ and __VERSION__ substituted.
#
# Pre-created in the cluster (not in git): namespace `plane` and the Secrets
#   plane-app-env (api/worker/beat-worker/migrator), plane-live-env, plane-mcp-env,
#   plane-proxy-env, plane-minio-env, plane-mq-env.
# PostgreSQL is the shared CloudNativePG cluster pg-main (database `plane`); `plane-db` is an
# ExternalName alias so DATABASE_URL/PGHOST keep their compose-era host name.
# Stateful pieces (Valkey, RabbitMQ, MinIO, backend) are pinned to the node labelled role=legacy.
# MinIO uses a locally imported image (imagePullPolicy: Never) because minio/minio no longer
# publishes pullable tags on Docker Hub.
apiVersion: v1
kind: Service
metadata: {name: plane-db, namespace: plane}
spec:
  type: ExternalName
  externalName: pg-main-rw.database.svc.cluster.local
  ports: [{port: 5432}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: plane-minio-data, namespace: plane}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: plane-mq-data, namespace: plane}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: plane-redis, namespace: plane}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: plane-redis}}
  template:
    metadata: {labels: {app: plane-redis}}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      nodeSelector: {role: legacy}
      containers:
        - name: plane-redis
          image: docker.io/valkey/valkey:7.2.11-alpine
          ports: [{containerPort: 6379}]
          resources: {requests: {cpu: 20m, memory: 16Mi}, limits: {memory: 256Mi}}
          readinessProbe: {tcpSocket: {port: 6379}, initialDelaySeconds: 2, periodSeconds: 10}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: plane-mq, namespace: plane}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: plane-mq}}
  template:
    metadata: {labels: {app: plane-mq}}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      nodeSelector: {role: legacy}
      containers:
        - name: plane-mq
          image: docker.io/library/rabbitmq:3.13.6-management-alpine
          ports: [{containerPort: 5672}]
          envFrom: [{secretRef: {name: plane-mq-env}}]
          env:
            - {name: RABBITMQ_NODENAME, value: rabbit@localhost}
          resources: {requests: {cpu: 20m, memory: 128Mi}, limits: {memory: 512Mi}}
          readinessProbe: {tcpSocket: {port: 5672}, initialDelaySeconds: 15, periodSeconds: 10}
          volumeMounts:
            - {name: data, mountPath: /var/lib/rabbitmq}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: plane-mq-data}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: plane-minio, namespace: plane}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: plane-minio}}
  template:
    metadata: {labels: {app: plane-minio}}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      nodeSelector: {role: legacy}
      containers:
        - name: plane-minio
          image: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
          imagePullPolicy: Never
          args: ["server","/export","--console-address",":9090"]
          ports: [{containerPort: 9000}]
          envFrom: [{secretRef: {name: plane-minio-env}}]
          resources: {requests: {cpu: 20m, memory: 128Mi}, limits: {memory: 512Mi}}
          readinessProbe: {tcpSocket: {port: 9000}, initialDelaySeconds: 5, periodSeconds: 10}
          volumeMounts:
            - {name: data, mountPath: /export}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: plane-minio-data}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: plane}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      nodeSelector: {role: legacy}
      containers:
        - name: api
          image: docker.io/__DOCKER_USERNAME__/plane-api:__VERSION__
          args: ["./bin/docker-entrypoint-api.sh"]
          ports: [{containerPort: 8000}]
          envFrom: [{secretRef: {name: plane-app-env}}]
          resources: {requests: {cpu: 20m, memory: 256Mi}, limits: {memory: 1536Mi}}
          readinessProbe: {tcpSocket: {port: 8000}, initialDelaySeconds: 20, periodSeconds: 10}
          volumeMounts:
            - {name: logs, mountPath: /code/plane/logs}
      volumes:
        - {name: logs, emptyDir: {}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: plane}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      enableServiceLinks: false
