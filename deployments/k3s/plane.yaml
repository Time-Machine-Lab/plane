---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: plane, namespace: plane}
spec:
  ingressClassName: traefik
  rules:
    - host: plane.tmlab.top
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: proxy, port: {number: 80}}}}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: plane-predeploy-backups, namespace: plane}
spec:
