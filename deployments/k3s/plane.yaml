          resources: {requests: {cpu: 20m, memory: 96Mi}, limits: {memory: 1536Mi}}
          volumeMounts:
            - {name: logs, mountPath: /code/plane/logs}
      volumes:
        - {name: logs, emptyDir: {}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: plane}
spec:
