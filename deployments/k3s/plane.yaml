          image: docker.io/__DOCKER_USERNAME__/plane-web:__VERSION__
          ports: [{containerPort: 3000}]
          resources: {requests: {cpu: 20m, memory: 16Mi}, limits: {memory: 256Mi}}
          readinessProbe: {tcpSocket: {port: 3000}, initialDelaySeconds: 3, periodSeconds: 10}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: admin, namespace: plane}
spec:
  replicas: 1
  strategy: {type: Recreate}
