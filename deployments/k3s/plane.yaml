          envFrom: [{secretRef: {name: plane-proxy-env}}]
          resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {memory: 256Mi}}
          readinessProbe: {tcpSocket: {port: 80}, initialDelaySeconds: 3, periodSeconds: 10}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: data, mountPath: /data}
      volumes:
        - {name: config, emptyDir: {}}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: plane-redis, namespace: plane}
spec:
  selector: {app: plane-redis}
  ports: [{port: 6379, targetPort: 6379}]
