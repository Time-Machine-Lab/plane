name: Release and Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Immutable release version (for example, v1.2.3)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  PUBLIC_URL: https://plane.tmlab.top

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate deployment configuration
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail

          for secret_name in KUBE_CONFIG DOCKER_USERNAME DOCKER_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Required GitHub Secret ${secret_name} is not configured."
              exit 1
            fi
          done

          [[ "$DOCKER_USERNAME" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || {
            echo "::error::DOCKER_USERNAME is not a valid Docker Hub namespace."
            exit 1
          }

      - name: Validate immutable version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            version="$REF_VERSION"
          fi

          version_pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          if [[ ! "$version" =~ $version_pattern ]]; then
            echo "Version must be an immutable SemVer tag such as v1.2.3 or v1.2.3-rc.1." >&2
            exit 1
          fi

          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: plane-web
            context: .
            dockerfile: ./apps/web/Dockerfile.web
          - image: plane-admin
            context: .
            dockerfile: ./apps/admin/Dockerfile.admin
          - image: plane-space
            context: .
            dockerfile: ./apps/space/Dockerfile.space
          - image: plane-live
            context: .
            dockerfile: ./apps/live/Dockerfile.live
          - image: plane-mcp
            context: .
            dockerfile: ./apps/mcp/Dockerfile.mcp
          - image: plane-api
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile.api
          - image: plane-proxy
            context: ./apps/proxy
            dockerfile: ./apps/proxy/Dockerfile.ce
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy production
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    environment: production
    env:
      # Production runs on the K3s cluster (k3s.seasonschange.cn), namespace plane.
      # KUBE_CONFIG is a kubeconfig for the namespace-scoped ServiceAccount plane/ci-deployer.
      NAMESPACE: plane
      VERSION: ${{ needs.prepare.outputs.version }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      APP_DEPLOYMENTS: api worker beat-worker web admin space live mcp proxy
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure cluster access
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.kube"
          printf '%s\n' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl -n "$NAMESPACE" get deployment api

      - name: Render manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/k3s"
          for f in deployments/k3s/*.yaml; do
            sed -e "s|__DOCKER_USERNAME__|$DOCKER_USERNAME|g" -e "s|__VERSION__|$VERSION|g" "$f" \
              > "$RUNNER_TEMP/k3s/$(basename "$f")"
          done
          ! grep -n "__[A-Z_]*__" "$RUNNER_TEMP"/k3s/*.yaml
          echo "Previous release: $(kubectl -n "$NAMESPACE" get deployment api -o jsonpath='{.spec.template.spec.containers[0].image}')"

      # Django migrations are not reversible, so dump the database before running them.
      - name: Back up database
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" delete job plane-predeploy-backup --ignore-not-found --wait=true
          kubectl -n "$NAMESPACE" apply -f "$RUNNER_TEMP/k3s/backup-job.yaml"
          if ! kubectl -n "$NAMESPACE" wait --for=condition=complete job/plane-predeploy-backup --timeout=10m; then
            kubectl -n "$NAMESPACE" logs job/plane-predeploy-backup --tail=50 || true
            echo "::error::Pre-release database backup failed; nothing was changed."
            exit 1
          fi
          kubectl -n "$NAMESPACE" logs job/plane-predeploy-backup

      - name: Run database migrations
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" delete job plane-migrator --ignore-not-found --wait=true
          kubectl -n "$NAMESPACE" apply -f "$RUNNER_TEMP/k3s/migrator-job.yaml"
          if ! kubectl -n "$NAMESPACE" wait --for=condition=complete job/plane-migrator --timeout=15m; then
            kubectl -n "$NAMESPACE" logs job/plane-migrator --tail=100 || true
            echo "::error::Migrations failed. The running release was not changed; the pre-release dump is in PVC plane-predeploy-backups."
            exit 1
          fi
          kubectl -n "$NAMESPACE" logs job/plane-migrator --tail=20

      - name: Roll out release
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" apply -f "$RUNNER_TEMP/k3s/plane.yaml"
          failed=""
          for d in $APP_DEPLOYMENTS; do
            kubectl -n "$NAMESPACE" rollout status "deployment/$d" --timeout=10m || failed="$failed $d"
          done
          if [[ -n "$failed" ]]; then
            kubectl -n "$NAMESPACE" get pods -o wide || true
            for d in $failed; do kubectl -n "$NAMESPACE" logs "deployment/$d" --tail=60 || true; done
            echo "::warning::Rolling back application deployments"
            for d in $APP_DEPLOYMENTS; do kubectl -n "$NAMESPACE" rollout undo "deployment/$d" || true; done
            for d in $APP_DEPLOYMENTS; do kubectl -n "$NAMESPACE" rollout status "deployment/$d" --timeout=10m || true; done
            echo "::error::Release $VERSION failed to become ready on:$failed (application images rolled back; migrations were not reversed)."
            exit 1
          fi

      - name: Verify production externally
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            --retry 30 --retry-delay 10 --retry-all-errors \
            "$PUBLIC_URL/" > /dev/null
          curl --fail --show-error --silent \
            --retry 10 --retry-delay 5 --retry-all-errors \
            "$PUBLIC_URL/api/instances/" > /dev/null

  promote:
    name: Promote ${{ matrix.image }} to latest
    needs:
      - prepare
      - deploy
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - plane-web
          - plane-admin
          - plane-space
          - plane-live
          - plane-mcp
          - plane-api
          - plane-proxy
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Promote immutable manifest
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          source_image="$DOCKER_USERNAME/$IMAGE:$VERSION"
          latest_image="$DOCKER_USERNAME/$IMAGE:latest"
          docker buildx imagetools create --tag "$latest_image" "$source_image"
          docker buildx imagetools inspect "$latest_image" > /dev/null
