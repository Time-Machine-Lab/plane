schema: spec-driven

context: |
  Plane is a pnpm/Turborepo monorepo with React applications in apps/web,
  apps/admin, and apps/space; a Django API in apps/api; a realtime service in
  apps/live; shared packages in packages/*; and proxy/deployment assets.

  docs/spec/README.md is the standards index. Read the standards mapped to the
  affected modules and preserve existing Plane patterns and module boundaries.
  After implementation and necessary development checks, the primary Agent
  creates a new Tester sub-agent that did not participate in implementation.
  The Tester independently verifies the requirement using the least expensive
  sufficient method: static, offline, local, or test-environment validation.
  Deploy only when the core goal requires a runtime environment, and then only
  deploy affected services. Automated tests are added only when risk and
  regression value justify them.

rules:
  proposal:
    - "State the goal, scope, non-goals, affected modules, and applicable docs/spec standards."
    - "Call out compatibility, migration, authorization, deployment, or licensing impact when relevant."
  specs:
    - "Express requirements as observable behavior with executable scenarios."
    - "Include important validation, failure, and authorization behavior when relevant."
  design:
    - "Keep design proportional; document important contracts, migrations, rollout, and rollback decisions only when applicable."
  tasks:
    - "Keep tasks concise; separate implementation, necessary development checks, and verification by a new Tester sub-agent that did not participate in implementation."
    - "Add automated tests only for clear regression value, and add test-environment deployment only when the core requirement cannot be verified statically, offline, or locally."
    - "Tester verification covers only the requirement goal, directly affected behavior, and necessary adjacent regression, with no fixed journey count or mandatory verification.md."
    - "After a fix, the same Tester rechecks only the failed scope and necessary adjacent behavior."
