schema: spec-driven

context: |
  Plane is a pnpm/Turborepo monorepo with React applications in apps/web,
  apps/admin, and apps/space; a Django API in apps/api; a realtime service in
  apps/live; shared packages in packages/*; and proxy/deployment assets.

  docs/spec/README.md is the standards index. Read the standards mapped to the
  affected modules and preserve existing Plane patterns and module boundaries.
  After runtime implementation, the primary Agent immediately deploys affected
  services with scripts/test/deploy-test.ps1, then creates a new Tester sub-agent
  that did not participate in implementation. The Tester independently verifies
  observable behavior in the deployed test environment. Local development checks
  are optional debugging aids and never deployment prerequisites. Do not add or
  run automated tests, pytest, Ruff, local Docker tests, or fixed lint/type/build
  matrices unless the user explicitly requests them. Pure documentation or static
  configuration changes may use static or offline validation without deployment.

rules:
  proposal:
    - "State the goal, scope, non-goals, affected modules, and applicable docs/spec standards."
    - "Call out compatibility, migration, authorization, deployment, or licensing impact when relevant."
  specs:
    - "Express requirements as observable behavior with executable scenarios."
    - "Include important validation, failure, and authorization behavior when relevant."
  design:
    - "Keep design proportional; document important contracts, migrations, rollout, and rollback decisions only when applicable."
  tasks:
    - "For runtime changes, keep tasks concise and separate implementation, immediate affected-service deployment, and verification by a new Tester sub-agent that did not participate in implementation."
    - "Do not create development-check, automated-test, pytest, Ruff, local-Docker, or fixed command-matrix tasks unless the user explicitly requests them."
    - "Tester verification runs against the deployed test environment and covers only the requirement goal, directly affected behavior, and necessary adjacent regression, with no fixed journey count or mandatory verification.md."
    - "After a fix, the same Tester rechecks only the failed scope and necessary adjacent behavior."
